<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

         .wrapper{
            padding: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        } 
        .header {
            background: #2e1b66;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: start;
        }

        .link {
            display: flex;
            align-items: center;
            justify-content: start;
            gap: 15px;
            max-width: 1240px;
            margin: 0 auto;
        }

        a {
            font-size: 25px;
            text-decoration: none;
            color: white;
        }

        body {
            background-color: #f1f5f9;
        }

        .card-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .card {
            width: 300px;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
            background: linear-gradient(to bottom right, #ffffff, #f0f4f8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease;
            background: linear-gradient(135deg, #dbeafe, #f0f9ff);
            color: #1e3a8a;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 1;

        }

        .content {
            font-size: 14px;
            color: #374151;
            line-height: 1.6;
            margin-bottom: 15px;
            white-space: pre-line;
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 5;

        }
       
    </style>
</head>

<body>
    <div class="header">
        <div class="link">
            <a href="./comments.html">comments |</a>
            <a href="./users.html">users</a>
            <a href="../index.html">| Uzum</a>
        </div>
    </div>
    <div class="wrapper">
    </div>

    <script src="../js/posts.js"></script>
</body>

</html>
