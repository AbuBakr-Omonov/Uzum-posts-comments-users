<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(to right, #7f7fd5, #86a8e7);
      min-height: 100vh;
    }

    .header {
      background: #2e1b66;
      height: 70px;
      display: flex;
      align-items: center;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 1240px;
      margin: 0 auto;
      padding-left: 20px;
    }

    a {
      font-size: 25px;
      text-decoration: none;
      color: white;
    }

    .wrapper {
      padding: 40px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      width: 320px;
      text-align: center;
      overflow: hidden;
      padding: 30px 20px;
    }

    .card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #6a11cb;
      object-fit: cover;
      margin-bottom: 15px;
    }

    .card h2 {
      font-size: 22px;
      color: #333;
      margin: 5px 0;
    }

    .card p.username {
      font-size: 14px;
      color: #777;
      margin-bottom: 15px;
    }

    .card .info {
      font-size: 14px;
      color: #444;
      margin-bottom: 10px;
    }

    .card .contact {
      margin-top: 15px;
      font-size: 13px;
      color: #555;
      background: #f0f0f0;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-block;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="link">
      <a href="./comments.html">comment</a>
      <a href="./posts.html">| posts</a>
      <a href="../index.html">| Uzum</a>
    </div>
  </div>

  <div class="wrapper">
  </div>

  <script src="../js/users.js"></script>
</body>

</html>
